name: Structural FCOI vertical slice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  exact-boolean-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Boolean slice only (separate from Vigil experiment)
        run: python -m pip install .
      - name: Hand calculations, exhaustive truth tables and invalid models
        run: python -m unittest discover -s tests/fcoi -v
      - name: Installed-package CLI from outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m cerberus_fcoi "$GITHUB_WORKSPACE/examples/fcoi/partial-overlap.json"
