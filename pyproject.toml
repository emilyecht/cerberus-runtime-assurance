[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-structural-fcoi"
version = "0.1.0"
description = "Model-relative Boolean minimal-cut-set research slice; no runtime authority"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Emily Echterhoff"}]
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
cerberus-fcoi = "cerberus_fcoi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cerberus_fcoi = ["*.json"]
